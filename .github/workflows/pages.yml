# Build the site with Zola and publish it on GitHub Pages, on every push to main (and by hand).
# The address is zola.toml's base_url, https://nibos.alanb.dev, set as the custom domain in
# Settings → Pages (Source: GitHub Actions); static/CNAME carries it in the output too.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.23.6"
  ZOLA_SHA256: "8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install Zola
        run: |
          f="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$f" "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/$f"
          echo "${ZOLA_SHA256}  $f" | sha256sum -c -
          tar xzf "$f" zola && sudo mv zola /usr/local/bin/
      - name: Build
        run: zola build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
