[package]
name = "console-shots"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
# The keyboard as nibOS 0.1.0-beta2's nibos-keys draws it: nibkit v0.1.0's draw list and rasteriser.
nibkit = { git = "https://github.com/abradburne/nibkit", tag = "v0.1.0", default-features = false, features = ["nibos", "menu-raster"] }
png = "0.17"
